<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - Foodie</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        nav {
            background: #ff4d4d;
            padding: 18px 7%;
            display: flex;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-right: auto;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        /* DELIVERY DETAILS */

        .details-title {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #ff4d4d;
        }

        .form-group textarea {
            resize: vertical;
        }

        /* ORDER SUMMARY */

        .summary-title {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .confirm {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
            font-weight: bold;
        }

        .confirm:hover {
            background: #e63c3c;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #ff4d4d;
            text-decoration: none;
        }

        @media (max-width: 600px) {

            .container {
                width: 95%;
                padding: 10px;
            }

            .box {
                padding: 20px;
            }

            nav {
                padding: 15px;
            }

            nav a {
                margin-left: 12px;
                font-size: 14px;
            }

        }

    </style>

</head>


<body>


<nav>

    <div class="logo">
        🍔 Foodie
    </div>

    <a href="{% url 'home' %}">
        Home
    </a>

    <a href="{% url 'cart' %}">
        🛒 Cart
    </a>

</nav>



<div class="container">


    <h1>
        🛍️ Checkout
    </h1>



    <form method="POST">

        {% csrf_token %}


        <!-- DELIVERY DETAILS -->

        <div class="box">

            <h2 class="details-title">
                📍 Delivery Details
            </h2>


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="customer_name"
                    placeholder="Enter your full name"
                    required
                >

            </div>



            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter your phone number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

            </div>



            <div class="form-group">

                <label>
                    Delivery Address
                </label>

                <textarea
                    name="delivery_address"
                    placeholder="Enter your complete delivery address"
                    rows="4"
                    required
                ></textarea>

            </div>

        </div>



        <!-- ORDER SUMMARY -->

        <div class="box">

            <h2 class="summary-title">
                🧾 Order Summary
            </h2>


            {% for item in cart_items %}

                <div class="item">

                    <span>
                        {{ item.food.name }}
                        × {{ item.quantity }}
                    </span>

                    <strong>
                        ₹{{ item.item_total }}
                    </strong>

                </div>

            {% endfor %}



            <div class="total">

                <span>
                    Total
                </span>

                <span>
                    ₹{{ total }}
                </span>

            </div>



            <button
                type="submit"
                class="confirm">

                ✅ Confirm Order

            </button>


            <a
                href="{% url 'cart' %}"
                class="back">

                ← Back to Cart

            </a>

        </div>


    </form>


</div>


</body>

</html>a
